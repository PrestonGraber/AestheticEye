services:
  web:
    image: node:22
    working_dir: /app
    restart: on-failure
    ports:
      - "3000:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command: ["sh", "-ec", "npm ci --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/', { signal: AbortSignal.timeout(3000) }).then(async r => { if (!r.ok || !(await r.text()).includes('/src/main.jsx')) process.exit(1); }).catch(e => { console.error('Frontend healthcheck failed:', e.message); process.exit(1); })"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 3

volumes:
  node_modules:
